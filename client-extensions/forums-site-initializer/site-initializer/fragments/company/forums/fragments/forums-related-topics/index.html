<div class="forums-related-topics" id="forumsRelatedTopics"
	data-label-no-related="${languageUtil.get(locale, "forums-no-related-topics-found")}"
	data-label-untitled="${languageUtil.get(locale, "untitled")}"
	data-label-unable-to-load="${languageUtil.get(locale, "forums-unable-to-load-related-topics")}"
	data-label-flagged="${languageUtil.get(locale, "forums-flagged")}"
	data-label-display-page-not-configured="${languageUtil.get(locale, "forums-display-page-not-configured-for-some-messages")}"
	data-label-erc-not-mapped="${languageUtil.get(locale, "forums-message-erc-not-mapped")}">
	<div class="panel-body">
		<!-- Mappable Message ERC fields — visible in the Content Page Editor for mapping, hidden at runtime -->
		<div id="forumsRelatedTopicsERC" data-lfr-editable-id="forumsRelatedTopicsERC" data-lfr-editable-type="text" style="display: none;">Mappable Message ERC</div>
		<div id="forumsRelatedTopicsReplyERC" data-lfr-editable-id="forumsRelatedTopicsReplyERC" data-lfr-editable-type="text" style="display: none;">Mappable Reply ERC</div>

		<h5 class="forums-related-topics__heading text-dark">
			${languageUtil.get(locale, "forums-related-topics")}
		</h5>
		<div class="list-group list-group-flush" id="forumsRelatedTopicsList">
			<div class="text-center py-3" id="forumsRelatedTopicsLoading">
				<span class="loading-animation loading-animation-sm" aria-hidden="true"></span>
				<span class="sr-only">${languageUtil.get(locale, "loading")}</span>
			</div>
		</div>
	</div>
</div>
